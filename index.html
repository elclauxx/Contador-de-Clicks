<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Clicks</title>
</head>
<body>
  <main>
    <h1>CONTADOR DE CLICKS</h1>
    <p id="counter">0</p>
    <div class="button-box">
      <button id="subtract100" class="button">-100</button>
      <button id="subtract10" class="button">-10</button>
      <button id="subtract1" class="button">-1</button>
      <button id="restore" class="button">RESTABLECER</button>
      <button id="plus1" class="button">+1</button>
      <button id="plus10" class="button">+10</button>
      <button id="plus 100" class="button">+100</button>
    </div>
    <div class="set-box">
      <input type="number" placeholder="Establece cuantos clicks" class="input-box">
      <button id="set" class="set">ESTABLECER</button>
    </div>
  </main>
</body>
</html>
